# Prometheus (PRD.md §9.8). Scrape port metrics internal; tidak lewat Caddy.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

# Alertmanager (profile monitoring). Tujuan notifikasi: ops/monitoring/alertmanager.yml.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: umkm-api
    static_configs:
      - targets: ["api:9090"]
  - job_name: umkm-worker
    static_configs:
      - targets: ["worker:9090"]

  # Metrik host (disk/RAM/CPU, PRD.md §14.3).
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
