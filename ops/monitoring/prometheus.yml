# Prometheus (PRD.md §9.8). Scrape port metrics internal; tidak lewat Caddy.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: umkm-api
    static_configs:
      - targets: ["api:9090"]
  - job_name: umkm-worker
    static_configs:
      - targets: ["worker:9090"]

# Alertmanager (tujuan notifikasi: email/chat on-call) belum ditetapkan.
# Disk/RAM/CPU host (PRD.md §14.3) butuh node-exporter: P8-5.
