# CI fail-closed (PRD.md §14.2). Branch protection cukup mewajibkan job `ci-gate`;
# job itu merah bila SATU saja job lain gagal, di-skip, atau dibatalkan.
# Semua action dipin ke commit SHA (tag di komentar).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  lint:
    name: fmt + clippy + boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: scripts/check-domain-boundary.sh
      - run: scripts/check-ci-needs.sh
      - run: python3 scripts/check-rtm.py

  test:
    name: unit + integration (PostgreSQL + Redis)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: umkm_owner
          POSTGRES_PASSWORD: ci_only_not_secret
          POSTGRES_DB: umkm_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U umkm_owner -d umkm_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://umkm_owner:ci_only_not_secret@localhost:5432/umkm_ci
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: sqlx-cli@0.9.0
      - name: Migrations up / down / up
        run: |
          sqlx migrate run --source migrations
          sqlx migrate revert --source migrations --target-version 0
          sqlx migrate run --source migrations
      - run: cargo test --workspace --locked

  supply-chain:
    name: dependency + license scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny
      - run: cargo deny check

  containers:
    name: compose config + docker build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker compose --env-file .env.example config -q
      - name: OpenAPI lint (Redocly)
        run: docker run --rm -v "$PWD/docs/api:/spec" redocly/cli:2.11.1 lint /spec/openapi.yaml
      - name: promtool check config + test rules
        run: |
          docker run --rm -v "$PWD/ops/monitoring:/etc/prometheus:ro" --entrypoint promtool \
            prom/prometheus:v3.7.3 check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/ops/monitoring:/etc/prometheus:ro" -w /etc/prometheus --entrypoint promtool \
            prom/prometheus:v3.7.3 test rules alerts_test.yml
      - name: amtool check-config (Alertmanager)
        run: |
          docker run --rm -v "$PWD/ops/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro" \
            -v "$PWD/ops/monitoring/secrets/telegram_bot_token.example:/etc/alertmanager/secrets/telegram_bot_token:ro" \
            --entrypoint amtool prom/alertmanager:v0.28.1 check-config /etc/alertmanager/alertmanager.yml
      - run: docker compose --env-file .env.example --profile monitoring config -q
      # ADR-0018: image api membawa site.html dari build frontend → butuh origin API yang sama dengan web.
      - run: docker build --target api --build-arg PUBLIC_API_ORIGIN=https://api.ryasai.my.id -t umkm-os/api:ci .
      - run: docker build --target worker -t umkm-os/worker:ci .
      - run: docker build -f ops/backup/Dockerfile -t umkm-os/backup:ci .
      - run: docker build --target web --build-arg PUBLIC_API_ORIGIN=https://api.ryasai.my.id -t umkm-os/web:ci .
      - name: shellcheck
        run: docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 scripts/*.sh scripts/load/*.sh ops/backup/*.sh

  workflow-lint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  frontend:
    name: frontend lint + typecheck + test + build + Caddy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node di dalam container (tanpa action pihak ketiga); versi dipin di frontend/package.json (exact).
      - name: lint, typecheck, unit test, audit, static export (ADR-0014)
        run: |
          docker run --rm -v "$PWD:/w" -w /w/frontend -e NEXT_TELEMETRY_DISABLED=1 \
            -e NEXT_PUBLIC_API_ORIGIN=https://api.ryasai.my.id node:22-bookworm-slim sh -euc '
              npm ci --no-audit
              npm ls >/dev/null
              npm audit --audit-level=high --omit=optional
              npm run lint
              npm run typecheck
              npm test
              npm run build'
      - name: Caddyfile valid dengan hasil build (CSP hash)
        run: |
          docker run --rm -e ROOT_DOMAIN=ryasai.my.id -e PUBLIC_API_ORIGIN=https://api.ryasai.my.id \
            -v "$PWD/frontend/out:/srv/www:ro" -v "$PWD/ops/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  ci-gate:
    name: ci-gate
    if: always()
    needs: [lint, test, supply-chain, containers, workflow-lint, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Aggregate (fail-closed)
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: scripts/ci-gate.sh
