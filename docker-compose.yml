# UMKM Business OS — single VPS (PRD.md §9.6). Limit memori dari PRD.md §9.3
# (estimasi perencanaan; disetel ulang setelah pengukuran P8-2).
# Secret di-inject dari .env saat runtime (lihat .env.example); tidak di-bake ke image.
name: umkm-os

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-app: &app
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging: *logging
  environment: &app-env
    UMKM_ENV: ${UMKM_ENV:?UMKM_ENV wajib}
    # Role aplikasi tanpa BYPASSRLS (P1-7); dibuat ops/postgres/init/10-app-user.sh
    UMKM_DATABASE_URL: postgres://umkm_app:${APP_DB_PASSWORD:?APP_DB_PASSWORD wajib}@postgres:5432/${POSTGRES_DB:?}
    UMKM_REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD wajib}@redis:6379/0
    # HMAC signed URL file (ADR-0009); >= 32 byte acak, mis. `openssl rand -base64 48`.
    UMKM_FILE_SIGNING_KEY: ${FILE_SIGNING_KEY:?FILE_SIGNING_KEY wajib}
    # Envelope encryption rahasia AI/MFA (ADR-0011); lihat .env.example.
    UMKM_DATA_KEK: ${DATA_KEK:?DATA_KEK wajib}
    # Opsional: kunci provider AI platform (ADR-0011).
    UMKM_PLATFORM_AI_API_KEY: ${PLATFORM_AI_API_KEY:-}
    RUST_LOG: ${RUST_LOG:-info}
    # Satu sumber kebenaran dengan Caddy (ADR-0001).
    UMKM_ROOT_DOMAIN: ${ROOT_DOMAIN:?ROOT_DOMAIN wajib}

services:
  caddy:
    # Caddy + build statis frontend (Dockerfile target `web`, ADR-0014).
    build:
      context: .
      target: web
      args:
        PUBLIC_API_ORIGIN: ${PUBLIC_API_ORIGIN:-http://api.${ROOT_DOMAIN}}
    image: ${WEB_IMAGE:-umkm-os/web:local}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
    environment:
      ROOT_DOMAIN: ${ROOT_DOMAIN:?ROOT_DOMAIN wajib (placeholder sampai D-01)}
      # Origin API untuk CSP (connect-src/img-src). http sampai TLS produksi aktif.
      PUBLIC_API_ORIGIN: ${PUBLIC_API_ORIGIN:-http://api.${ROOT_DOMAIN}}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits: { memory: 64M, cpus: "0.50" }

  migrate:
    <<: *app
    image: ${API_IMAGE:-umkm-os/api:local}
    # ADR-0018: arg sama dengan image web agar shell situs (site.html) identik dengan yang disajikan Caddy.
    build:
      context: .
      target: api
      args:
        PUBLIC_API_ORIGIN: ${PUBLIC_API_ORIGIN:-http://api.${ROOT_DOMAIN}}
    command: ["migrate"]
    restart: "no"
    environment:
      <<: *app-env
      # Migration memakai owner skema (bukan role aplikasi).
      UMKM_DATABASE_URL: postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib}@postgres:5432/${POSTGRES_DB:?}
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 256M, cpus: "0.50" }

  api:
    <<: *app
    image: ${API_IMAGE:-umkm-os/api:local}
    # ADR-0018: arg sama dengan image web agar shell situs (site.html) identik dengan yang disajikan Caddy.
    build:
      context: .
      target: api
      args:
        PUBLIC_API_ORIGIN: ${PUBLIC_API_ORIGIN:-http://api.${ROOT_DOMAIN}}
    command: ["serve"]
    networks: [edge, backend]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "umkm-api", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits: { memory: 512M, cpus: "1.50" }

  worker:
    <<: *app
    image: ${WORKER_IMAGE:-umkm-os/worker:local}
    build: { context: ., target: worker }
    networks: [backend]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    # Healthcheck worker (heartbeat outbox) ditambahkan di P1-6 saat ada job nyata.
    deploy:
      resources:
        limits: { memory: 384M, cpus: "1.00" }

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
    # Baseline PRD.md §9.4 (harus diuji, P8-3)
    command:
      - postgres
      - -c
      - max_connections=50
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - wal_buffers=16MB
      - -c
      - max_wal_size=1GB
      - -c
      - checkpoint_timeout=15min
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./ops/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { memory: 2048M, cpus: "2.00" }

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    # PRD.md §9.5: noeviction agar key koordinasi tidak hilang diam-diam.
    command: ["sh", "-c", "exec redis-server --maxmemory 192mb --maxmemory-policy noeviction --appendonly no --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { memory: 256M, cpus: "0.50" }

  backup:
    image: ${BACKUP_IMAGE:-umkm-os/backup:local}
    build: { context: ., dockerfile: ops/backup/Dockerfile }
    profiles: [backup]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:?}
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      PGDATABASE: ${POSTGRES_DB:?}
      BACKUP_DIR: /backups
      # File sementara dump di volume, bukan tmpfs (RAM VPS 8 GB).
      TMPDIR: /backups/.tmp
      BACKUP_AT_UTC: ${BACKUP_AT_UTC:-02:00}
      # Public key age; kosong -> backup.sh exit 2 (fail-closed).
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      # Off-site menunggu D-07; kosong -> backup.sh exit 3 setiap run (sengaja terlihat gagal).
      BACKUP_OFFSITE_CMD: ${BACKUP_OFFSITE_CMD:-}
    volumes:
      - backup_data:/backups
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 256M, cpus: "0.50" }

  prometheus:
    image: prom/prometheus:v3.7.3
    profiles: [monitoring]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=1GB
    volumes:
      - ./ops/monitoring:/etc/prometheus:ro
      - prometheus_data:/prometheus
    # Hanya jaringan internal; UI diakses via `docker compose port`/SSH tunnel, tidak dipublish.
    networks: [backend]
    deploy:
      resources:
        limits: { memory: 200M, cpus: "0.50" }

  alertmanager:
    image: prom/alertmanager:v0.28.1
    profiles: [monitoring]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      # Kanal on-call Telegram (2026-11-13). Config & token produksi di luar repo; default = contoh.
      - ${ALERTMANAGER_CONFIG:-./ops/monitoring/alertmanager.yml}:/etc/alertmanager/alertmanager.yml:ro
      - ${ALERT_TELEGRAM_BOT_TOKEN_FILE:-./ops/monitoring/secrets/telegram_bot_token.example}:/etc/alertmanager/secrets/telegram_bot_token:ro
      - alertmanager_data:/alertmanager
    # Butuh keluar ke internet (api.telegram.org); tidak dipublish.
    networks: [backend, edge]
    deploy:
      resources:
        limits: { memory: 64M, cpus: "0.25" }

  node-exporter:
    image: prom/node-exporter:v1.9.1
    profiles: [monitoring]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    pid: host
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    networks: [backend]
    deploy:
      resources:
        limits: { memory: 64M, cpus: "0.25" }

networks:
  edge: {}
  # Postgres/Redis hanya di jaringan internal tanpa port publik (PRD.md §9.6).
  backend:
    internal: true

volumes:
  pg_data:
  redis_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  backup_data:
  alertmanager_data:
