<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font: 13px/1.5 system-ui, sans-serif; width: 320px; margin: 0; padding: 14px; color: #0f172a; }
    h1 { font-size: 14px; margin: 0 0 4px; }
    p { margin: 0 0 10px; color: #475569; }
    label { display: block; font-weight: 600; margin: 10px 0 4px; }
    input { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #cbd5e1; border-radius: 8px; }
    button { width: 100%; padding: 9px; border: 0; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 10px; }
    .primary { background: #4f46e5; color: #fff; }
    .ghost { background: #f1f5f9; color: #0f172a; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .status { margin-top: 12px; padding: 8px 10px; border-radius: 8px; font-weight: 600; }
    .ok { background: #ecfdf5; color: #047857; }
    .no { background: #fef2f2; color: #b91c1c; }
  </style>
</head>
<body>
  <h1>Hubungkan GoPay ke UMKM OS</h1>
  <p>Login GoBiz di browser ini, lalu kirim sesinya ke dashboard tanpa menyalin token.</p>
  <label for="url">URL dashboard UMKM OS</label>
  <input id="url" type="url" placeholder="mis. https://app.domainanda.com" />
  <button id="login" class="ghost" type="button">1. Buka &amp; login GoBiz</button>
  <button id="connect" class="primary" type="button" disabled>2. Hubungkan ke UMKM OS</button>
  <div id="status" class="status no">Belum login GoBiz di browser ini.</div>
  <script src="popup.js"></script>
</body>
</html>
