[workspace]
resolver = "3"
members = ["apps/*", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
umkm-shared = { path = "crates/shared" }
umkm-domain = { path = "crates/domain" }
umkm-application = { path = "crates/application" }
umkm-infrastructure = { path = "crates/infrastructure" }
umkm-database = { path = "crates/database" }

# Dependency eksternal: setiap entri tercatat di docs/architecture/dependency-review.md (PRD.md §7.1)
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
thiserror = "2.0.21"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
