[workspace]
resolver = "3"
members = ["apps/*", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
umkm-shared = { path = "crates/shared" }
umkm-domain = { path = "crates/domain" }
umkm-application = { path = "crates/application" }
umkm-infrastructure = { path = "crates/infrastructure" }
umkm-database = { path = "crates/database" }

# Dependency eksternal: setiap entri tercatat di docs/architecture/dependency-review.md (PRD.md §7.1)
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
thiserror = "2.0.21"
serde_json = "1.0.154"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
axum = "0.8.9"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace", "catch-panic", "limit", "timeout", "set-header", "cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "json", "env-filter"] }
http-body-util = "0.1.5"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
prometheus-client = "0.26.0"
argon2 = "0.6.0"
sha2 = "0.11.1"
getrandom = "0.4.3"
base64 = "0.22.1"
utoipa = { version = "6.0.0", default-features = false, features = ["macros"] }
redis = { version = "1.8.1", default-features = false, features = ["tokio-comp", "connection-manager", "script"] }
# default-features off: tanpa driver mysql/sqlite/any. TLS ke DB belum dipakai (jaringan internal Docker, PRD.md §9.6).
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "macros", "migrate", "uuid", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
