      - UNAUTHORIZED
      - FORBIDDEN
      - RESOURCE_NOT_FOUND
      - METHOD_NOT_ALLOWED
      - REQUEST_TIMEOUT
      - CONFLICT
      - PAYLOAD_TOO_LARGE
      - UNSUPPORTED_MEDIA_TYPE
      - VALIDATION_FAILED
      - RATE_LIMITED
      - INTERNAL_ERROR
      - SERVICE_UNAVAILABLE
