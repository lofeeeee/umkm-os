openapi: 3.1.0
info:
  title: UMKM Business OS API
  description: Kontrak HTTP. Endpoint bisnis memakai prefix `/api/v1` (PRD.md §7.4). Semua error memakai ErrorEnvelope; header `x-request-id` == `meta.request_id`.
  version: 0.1.0
servers:
- url: /
  description: Origin yang sama; root domain menunggu D-01
paths:
  /api/v1/approval-entity-types:
    get:
      tags:
      - approvals
      summary: Tipe entity yang didukung engine.
      operationId: entity_types
      responses:
        '200':
          description: Tipe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_Vec_String'
        '405':
          description: Method tidak diizinkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '408':
          description: Request melebihi `server.request_timeout_secs`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Body melebihi `server.body_limit_bytes`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Kesalahan internal (tanpa detail internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - sessionCookie: []
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Login email + password. Pesan gagal seragam (anti user-enumeration).
      operationId: login_handler
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Sesi baru (rotasi); cookie di-set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_SessionResponse'
        '202':
          description: 'Password benar, MFA aktif: lanjutkan ke `/auth/login/mfa` (tanpa cookie)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_MfaChallengeResponse'
        '401':
          description: Email atau password salah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Origin tidak diizinkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '405':
          description: Method tidak diizinkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '408':
          description: Request melebihi `server.request_timeout_secs`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Body melebihi `server.body_limit_bytes`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limit; header Retry-After
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Kesalahan internal (tanpa detail internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Rate limiter/DB tidak tersedia (fail-closed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security: []
  /api/v1/auth/login/mfa:
    post:
      tags:
      - auth
      summary: Selesaikan login dengan kode MFA. Kode salah 5× membatalkan tantangan.
      operationId: login_mfa
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginMfaRequest'
        required: true
      responses:
        '200':
          description: Sesi baru bertanda MFA; cookie di-set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_SessionResponse'
        '401':
          description: Tantangan tidak valid/kedaluwarsa/habis percobaan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Origin tidak diizinkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '405':
          description: Method tidak diizinkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '408':
          description: Request melebihi `server.request_timeout_secs`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Body melebihi `server.body_limit_bytes`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Kode salah; `details.field = code`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limit; header Retry-After
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Kesalahan internal (tanpa detail internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Rate limiter/DB/KEK tidak tersedia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security: []
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      summary: 'Logout: cabut sesi ini (AUTH-006). Wajib header `X-CSRF-Token`.'
      operationId: logout_handler
      responses:
        '200':
          description: Sesi dicabut; cookie dihapus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_LogoutResponse'
        '401':
          description: Tidak ada sesi valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: CSRF token/Origin tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '405':
          description: Method tidak diizinkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '408':
          description: Request melebihi `server.request_timeout_secs`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Body melebihi `server.body_limit_bytes`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Kesalahan internal (tanpa detail internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - sessionCookie: []
  /api/v1/auth/mfa:
    get:
      tags:
      - auth
      summary: Status MFA akun pemanggil.
      operationId: mfa_status
      responses:
        '200':
          description: Status MFA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_MfaStatusView'
        '401':
          description: Tidak ada sesi valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '405':
          description: Method tidak diizinkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '408':
          description: Request melebihi `server.request_timeout_secs`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Body melebihi `server.body_limit_bytes`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Kesalahan internal (tanpa detail internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - sessionCookie: []
  /api/v1/auth/mfa/disable:
    post:
      tags:
      - auth
      summary: 'Matikan MFA: butuh password + kode. Ditolak untuk akun yang wajib MFA (AUTH-011).'
      operationId: mfa_disable
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaDisableRequest'
        required: true
      responses:
        '200':
          description: MFA dimatikan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_MfaDisabledView'
        '401':
          description: Tidak ada sesi valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Akun wajib MFA, atau CSRF/Origin tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '405':
          description: Method tidak diizinkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '408':
          description: Request melebihi `server.request_timeout_secs`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: MFA belum aktif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Body melebihi `server.body_limit_bytes`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Password/kode salah; `details.field`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Kesalahan internal (tanpa detail internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - sessionCookie: []
  /api/v1/auth/mfa/enable:
    post:
      tags:
      - auth
      summary: Aktifkan MFA dengan kode authenticator. Sesi lain akun ini dicabut.
      operationId: mfa_enable
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaCodeRequest'
        required: true
      responses:
        '200':
          description: MFA aktif; kode pemulihan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_RecoveryCodesView'
        '401':
          description: Tidak ada sesi valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: CSRF/Origin tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '405':
          description: Method tidak diizinkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '408':
          description: Request melebihi `server.request_timeout_secs`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Belum setup / sudah aktif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Body melebihi `server.body_limit_bytes`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Kode salah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Kesalahan internal (tanpa detail internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - sessionCookie: []
  /api/v1/auth/mfa/recovery-codes:
    post:
      tags:
      - auth
      summary: Ganti seluruh kode pemulihan (butuh kode authenticator).
      operationId: mfa_recovery_codes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaCodeRequest'
        required: true
      responses:
        '200':
          description: Kode pemulihan baru
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_RecoveryCodesView'
        '401':
          description: Tidak ada sesi valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '405':
          description: Method tidak diizinkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '408':
          description: Request melebihi `server.request_timeout_secs`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: MFA belum aktif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Body melebihi `server.body_limit_bytes`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Kode salah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Kesalahan internal (tanpa detail internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - sessionCookie: []
  /api/v1/auth/mfa/setup:
    post:
      tags:
      - auth
      summary: Buat rahasia TOTP baru (belum aktif sampai dikonfirmasi lewat `/auth/mfa/enable`).
      operationId: mfa_setup
      responses:
        '200':
          description: Rahasia baru
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_MfaSetupView'
        '401':
          description: Tidak ada sesi valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: CSRF/Origin tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '405':
          description: Method tidak diizinkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '408':
          description: Request melebihi `server.request_timeout_secs`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: MFA sudah aktif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Body melebihi `server.body_limit_bytes`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Kesalahan internal (tanpa detail internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - sessionCookie: []
  /api/v1/auth/register:
    post:
      tags:
      - auth
      summary: 'Registrasi bisnis: user + tenant + Owner + subdomain + sesi (`PRD.md §13.3`).'
      operationId: register_handler
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          description: Terdaftar; cookie sesi di-set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_RegisterResponse'
        '403':
          description: Origin tidak diizinkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '405':
          description: Method tidak diizinkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '408':
          description: Request melebihi `server.request_timeout_secs`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Email atau slug sudah dipakai/dicadangkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Body melebihi `server.body_limit_bytes`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Validasi gagal; `details.field`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limit; header Retry-After
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Kesalahan internal (tanpa detail internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Rate limiter/DB tidak tersedia (fail-closed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security: []
  /api/v1/auth/session:
    get:
      tags:
      - auth
      summary: 'Sesi aktif dari cookie (untuk reload SPA: mengambil ulang `csrf_token`).'
      operationId: session_handler
      responses:
        '200':
          description: Sesi valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_SessionStateResponse'
        '401':
          description: Tidak ada sesi valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '405':
          description: Method tidak diizinkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '408':
          description: Request melebihi `server.request_timeout_secs`
          content:
            application/json:
              schema:
