components:
  schemas:
    AddressDto:
      type: object
      required:
      - address
      properties:
        address:
          type: string
        label:
          type:
          - string
          - 'null'
        latitude:
          type:
          - number
          - 'null'
          format: double
        longitude:
          type:
          - number
          - 'null'
          format: double
      additionalProperties: false
    BusinessView:
      type: object
      required:
      - profile
      - addresses
      - hours
      - exceptions
      properties:
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/AddressDto'
        exceptions:
          type: array
          items:
            $ref: '#/components/schemas/ExceptionDto'
        hours:
          type: array
          items:
            $ref: '#/components/schemas/HoursDto'
        profile:
          $ref: '#/components/schemas/ProfileDto'
    CheckResult:
      type: object
      required:
      - name
      - ok
      properties:
        name:
          type: string
        ok:
          type: boolean
    ErrorBody:
      type: object
      description: |-
        Isi `error`. `message` ditujukan ke klien: jangan isi dengan SQL, stack trace,
        secret, atau topologi internal (`PRD.md §6.4`).
      required:
      - code
      - message
      - details
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        details:
          type:
          - object
          - 'null'
        message:
          type: string
