openapi: 3.1.0
info:
  title: UMKM Business OS API
  description: Kontrak HTTP. Endpoint bisnis memakai prefix `/api/v1` (PRD.md §7.4). Semua error memakai ErrorEnvelope; header `x-request-id` == `meta.request_id`.
  version: 0.1.0
servers:
- url: /
  description: Origin yang sama; root domain menunggu D-01
paths:
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Login email + password. Pesan gagal seragam (anti user-enumeration).
      operationId: login_handler
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Sesi baru (rotasi); cookie di-set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_SessionResponse'
        '401':
          description: Email atau password salah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Origin tidak diizinkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '405':
          description: Method tidak diizinkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '408':
          description: Request melebihi `server.request_timeout_secs`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Body melebihi `server.body_limit_bytes`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limit; header Retry-After
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Kesalahan internal (tanpa detail internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Rate limiter/DB tidak tersedia (fail-closed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security: []
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      summary: 'Logout: cabut sesi ini (AUTH-006). Wajib header `X-CSRF-Token`.'
      operationId: logout_handler
      responses:
        '200':
          description: Sesi dicabut; cookie dihapus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_LogoutResponse'
        '401':
          description: Tidak ada sesi valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: CSRF token/Origin tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '405':
          description: Method tidak diizinkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '408':
          description: Request melebihi `server.request_timeout_secs`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Body melebihi `server.body_limit_bytes`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Kesalahan internal (tanpa detail internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - sessionCookie: []
  /api/v1/auth/register:
    post:
      tags:
      - auth
      summary: 'Registrasi bisnis: user + tenant + Owner + subdomain + sesi (`PRD.md §13.3`).'
      operationId: register_handler
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          description: Terdaftar; cookie sesi di-set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_RegisterResponse'
        '403':
          description: Origin tidak diizinkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '405':
          description: Method tidak diizinkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '408':
          description: Request melebihi `server.request_timeout_secs`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Email atau slug sudah dipakai/dicadangkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Body melebihi `server.body_limit_bytes`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Validasi gagal; `details.field`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limit; header Retry-After
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Kesalahan internal (tanpa detail internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Rate limiter/DB tidak tersedia (fail-closed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security: []
  /api/v1/auth/session:
    get:
      tags:
      - auth
      summary: 'Sesi aktif dari cookie (untuk reload SPA: mengambil ulang `csrf_token`).'
      operationId: session_handler
      responses:
        '200':
          description: Sesi valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_SessionResponse'
        '401':
          description: Tidak ada sesi valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '405':
          description: Method tidak diizinkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '408':
          description: Request melebihi `server.request_timeout_secs`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Body melebihi `server.body_limit_bytes`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Kesalahan internal (tanpa detail internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - sessionCookie: []
  /api/v1/auth/verify-email:
    post:
      tags:
      - auth
      summary: Verifikasi email dengan token sekali pakai (AUTH-003). Tidak butuh sesi.
      operationId: verify_email_handler
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
        required: true
      responses:
        '200':
          description: Email terverifikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_VerifyEmailResponse'
        '403':
          description: Origin tidak diizinkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '405':
          description: Method tidak diizinkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '408':
          description: Request melebihi `server.request_timeout_secs`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Body melebihi `server.body_limit_bytes`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Token tidak valid, kedaluwarsa, atau sudah dipakai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limit; header Retry-After
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Kesalahan internal (tanpa detail internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Rate limiter/DB tidak tersedia (fail-closed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security: []
  /api/v1/tenants:
    get:
      tags:
      - tenants
      summary: Tenant tempat pemanggil menjadi anggota aktif (AUTH-008).
      operationId: list_tenants
      responses:
        '200':
          description: Daftar membership aktif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_Vec_MembershipItem'
        '401':
          description: Tidak ada sesi valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '405':
          description: Method tidak diizinkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '408':
          description: Request melebihi `server.request_timeout_secs`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Body melebihi `server.body_limit_bytes`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Kesalahan internal (tanpa detail internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - sessionCookie: []
  /api/v1/tenants/{tenant_id}:
    get:
      tags:
      - tenants
      summary: Detail tenant. Butuh `tenant.read`. Bukan anggota -> 404.
      operationId: get_tenant
      parameters:
      - name: tenant_id
        in: path
        description: Selector tenant; diverifikasi terhadap membership
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Detail tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_TenantView'
        '401':
          description: Tidak ada sesi valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Permission kurang; `details.required_permission`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Tenant tidak ada atau bukan anggota
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '405':
          description: Method tidak diizinkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '408':
          description: Request melebihi `server.request_timeout_secs`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Body melebihi `server.body_limit_bytes`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Kesalahan internal (tanpa detail internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - sessionCookie: []
    patch:
      tags:
      - tenants
      summary: Ubah nama tenant. Butuh `tenant.update` + `X-CSRF-Token`.
      operationId: update_tenant
      parameters:
      - name: tenant_id
        in: path
        description: Selector tenant; diverifikasi terhadap membership
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTenantRequest'
        required: true
      responses:
        '200':
          description: Tenant diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_TenantView'
        '401':
          description: Tidak ada sesi valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Permission kurang atau CSRF/Origin tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Tenant tidak ada atau bukan anggota
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '405':
          description: Method tidak diizinkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '408':
          description: Request melebihi `server.request_timeout_secs`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Body melebihi `server.body_limit_bytes`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Nama tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Kesalahan internal (tanpa detail internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - sessionCookie: []
  /api/v1/tenants/{tenant_id}/events:
    get:
      tags:
      - tenants
      summary: Stream event tenant (SSE). Butuh `tenant.read`.
      operationId: tenant_events
      parameters:
      - name: tenant_id
        in: path
        description: Selector tenant; diverifikasi terhadap membership
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: text/event-stream; hanya event tenant ini
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          description: Tidak ada sesi valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Permission kurang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Bukan anggota
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '405':
          description: Method tidak diizinkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '408':
          description: Request melebihi `server.request_timeout_secs`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Body melebihi `server.body_limit_bytes`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Kesalahan internal (tanpa detail internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Batas koneksi realtime tercapai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - sessionCookie: []
  /api/v1/tenants/{tenant_id}/uploads:
    get:
      tags:
      - files
      summary: Daftar file tenant untuk pemilih gambar editor. Butuh `website.read`.
      operationId: list_uploads
      parameters:
      - name: tenant_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: File tenant (terbaru dulu)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_Vec_UploadView'
        '405':
          description: Method tidak diizinkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '408':
          description: Request melebihi `server.request_timeout_secs`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Body melebihi `server.body_limit_bytes`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Kesalahan internal (tanpa detail internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - sessionCookie: []
    post:
      tags:
      - files
      summary: Upload gambar (AC-FILE-001/002). Butuh `website.edit`.
      operationId: upload
      parameters:
      - name: tenant_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Byte mentah PNG/JPEG/WebP, maks storage.max_object_bytes
        content:
          application/octet-stream:
            schema:
              type: array
              items:
                type: integer
                format: int32
                minimum: 0
        required: true
      responses:
        '201':
          description: Tersimpan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_UploadView'
        '405':
          description: Method tidak diizinkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '408':
          description: Request melebihi `server.request_timeout_secs`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Terlalu besar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Tipe/struktur ditolak atau kuota habis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Kesalahan internal (tanpa detail internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - sessionCookie: []
  /api/v1/tenants/{tenant_id}/uploads/{object_id}:
    delete:
      tags:
      - files
      summary: Hapus file yang tidak dirujuk halaman mana pun. Butuh `website.edit`.
      operationId: delete_upload
      parameters:
      - name: tenant_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: object_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Dihapus
        '404':
          description: Tidak ada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '405':
          description: Method tidak diizinkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '408':
          description: Request melebihi `server.request_timeout_secs`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Masih dirujuk halaman
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Body melebihi `server.body_limit_bytes`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Kesalahan internal (tanpa detail internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - sessionCookie: []
  /files/{object_id}:
    get:
      tags:
      - files
      summary: Sajikan objek via signed URL (AC-FILE-003..005). Publik, tanpa cookie.
      operationId: serve_file
      parameters:
      - name: object_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: t
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: exp
        in: query
        required: true
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: sig
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Byte gambar
          content:
            image/*: {}
        '404':
          description: Signature salah/kedaluwarsa/objek tidak ada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '405':
          description: Method tidak diizinkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '408':
          description: Request melebihi `server.request_timeout_secs`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Body melebihi `server.body_limit_bytes`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Kesalahan internal (tanpa detail internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security: []
  /healthz:
    get:
      tags:
      - ops
      summary: 'Liveness: proses hidup. Tidak menyentuh dependensi.'
      operationId: healthz
      responses:
        '200':
          description: Proses hidup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_Status'
        '405':
          description: Method tidak diizinkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '408':
          description: Request melebihi `server.request_timeout_secs`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Body melebihi `server.body_limit_bytes`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Kesalahan internal (tanpa detail internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security: []
  /readyz:
    get:
      tags:
      - ops
      summary: 'Readiness: semua dependensi terdaftar siap. Gagal -> 503 tanpa detail internal.'
      operationId: readyz
      responses:
        '200':
          description: Semua dependensi siap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_Readiness'
        '405':
          description: Method tidak diizinkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '408':
          description: Request melebihi `server.request_timeout_secs`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Body melebihi `server.body_limit_bytes`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Kesalahan internal (tanpa detail internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Ada dependensi tidak siap; `details.failing_checks` berisi nama check
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security: []
components:
  schemas:
    CheckResult:
      type: object
      required:
      - name
      - ok
      properties:
        name:
          type: string
        ok:
          type: boolean
    ErrorBody:
      type: object
      description: |-
        Isi `error`. `message` ditujukan ke klien: jangan isi dengan SQL, stack trace,
        secret, atau topologi internal (`PRD.md §6.4`).
      required:
      - code
      - message
      - details
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        details:
          type:
          - object
          - 'null'
