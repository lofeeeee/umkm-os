openapi: 3.1.0
info:
  title: UMKM Business OS API
  description: Kontrak HTTP. Endpoint bisnis memakai prefix `/api/v1` (PRD.md §7.4). Semua error memakai ErrorEnvelope; header `x-request-id` == `meta.request_id`.
  version: 0.1.0
servers:
- url: /
  description: Origin yang sama; root domain menunggu D-01
paths:
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Login email + password. Pesan gagal seragam (anti user-enumeration).
      operationId: login_handler
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Sesi baru (rotasi); cookie di-set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_SessionResponse'
        '401':
          description: Email atau password salah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Origin tidak diizinkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '405':
          description: Method tidak diizinkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '408':
          description: Request melebihi `server.request_timeout_secs`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Body melebihi `server.body_limit_bytes`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limit; header Retry-After
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Kesalahan internal (tanpa detail internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Rate limiter/DB tidak tersedia (fail-closed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security: []
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      summary: 'Logout: cabut sesi ini (AUTH-006). Wajib header `X-CSRF-Token`.'
      operationId: logout_handler
      responses:
        '200':
          description: Sesi dicabut; cookie dihapus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_LogoutResponse'
        '401':
          description: Tidak ada sesi valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: CSRF token/Origin tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '405':
          description: Method tidak diizinkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '408':
          description: Request melebihi `server.request_timeout_secs`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Body melebihi `server.body_limit_bytes`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Kesalahan internal (tanpa detail internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - sessionCookie: []
  /api/v1/auth/register:
    post:
      tags:
      - auth
      summary: 'Registrasi bisnis: user + tenant + Owner + subdomain + sesi (`PRD.md §13.3`).'
      operationId: register_handler
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          description: Terdaftar; cookie sesi di-set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_RegisterResponse'
        '403':
          description: Origin tidak diizinkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '405':
          description: Method tidak diizinkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '408':
          description: Request melebihi `server.request_timeout_secs`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Email atau slug sudah dipakai/dicadangkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Body melebihi `server.body_limit_bytes`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Validasi gagal; `details.field`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limit; header Retry-After
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Kesalahan internal (tanpa detail internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Rate limiter/DB tidak tersedia (fail-closed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security: []
  /api/v1/auth/session:
    get:
      tags:
      - auth
      summary: 'Sesi aktif dari cookie (untuk reload SPA: mengambil ulang `csrf_token`).'
      operationId: session_handler
      responses:
        '200':
          description: Sesi valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_SessionResponse'
        '401':
          description: Tidak ada sesi valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '405':
          description: Method tidak diizinkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '408':
          description: Request melebihi `server.request_timeout_secs`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Body melebihi `server.body_limit_bytes`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Kesalahan internal (tanpa detail internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - sessionCookie: []
  /api/v1/auth/verify-email:
    post:
      tags:
      - auth
      summary: Verifikasi email dengan token sekali pakai (AUTH-003). Tidak butuh sesi.
      operationId: verify_email_handler
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
        required: true
      responses:
        '200':
          description: Email terverifikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_VerifyEmailResponse'
        '403':
          description: Origin tidak diizinkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '405':
          description: Method tidak diizinkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '408':
          description: Request melebihi `server.request_timeout_secs`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Body melebihi `server.body_limit_bytes`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Token tidak valid, kedaluwarsa, atau sudah dipakai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limit; header Retry-After
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Kesalahan internal (tanpa detail internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Rate limiter/DB tidak tersedia (fail-closed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security: []
  /api/v1/public/site:
    get:
      tags:
      - public
      summary: Situs publik tenant dari Host (ADR-0014). Tanpa sesi; cache publik 60 detik.
      operationId: public_site
      parameters:
      - name: page
        in: query
        description: Slug halaman, default `home`
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Versi terbit + data bisnis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_PublicSite'
        '404':
          description: Host tidak dikenal/nonaktif atau belum terbit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '405':
          description: Method tidak diizinkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '408':
          description: Request melebihi `server.request_timeout_secs`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Body melebihi `server.body_limit_bytes`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Kesalahan internal (tanpa detail internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security: []
  /api/v1/tenants:
    get:
      tags:
      - tenants
      summary: Tenant tempat pemanggil menjadi anggota aktif (AUTH-008).
      operationId: list_tenants
      responses:
        '200':
          description: Daftar membership aktif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_Vec_MembershipItem'
        '401':
          description: Tidak ada sesi valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '405':
          description: Method tidak diizinkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '408':
          description: Request melebihi `server.request_timeout_secs`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Body melebihi `server.body_limit_bytes`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Kesalahan internal (tanpa detail internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - sessionCookie: []
  /api/v1/tenants/{tenant_id}:
    get:
      tags:
      - tenants
      summary: Detail tenant. Butuh `tenant.read`. Bukan anggota -> 404.
      operationId: get_tenant
      parameters:
      - name: tenant_id
        in: path
        description: Selector tenant; diverifikasi terhadap membership
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Detail tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_TenantView'
        '401':
          description: Tidak ada sesi valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Permission kurang; `details.required_permission`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Tenant tidak ada atau bukan anggota
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '405':
          description: Method tidak diizinkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '408':
          description: Request melebihi `server.request_timeout_secs`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Body melebihi `server.body_limit_bytes`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Kesalahan internal (tanpa detail internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - sessionCookie: []
    patch:
      tags:
      - tenants
      summary: Ubah nama tenant. Butuh `tenant.update` + `X-CSRF-Token`.
      operationId: update_tenant
      parameters:
      - name: tenant_id
        in: path
        description: Selector tenant; diverifikasi terhadap membership
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTenantRequest'
        required: true
      responses:
        '200':
          description: Tenant diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_TenantView'
        '401':
          description: Tidak ada sesi valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Permission kurang atau CSRF/Origin tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Tenant tidak ada atau bukan anggota
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '405':
          description: Method tidak diizinkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '408':
          description: Request melebihi `server.request_timeout_secs`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Body melebihi `server.body_limit_bytes`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Nama tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Kesalahan internal (tanpa detail internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - sessionCookie: []
  /api/v1/tenants/{tenant_id}/business/addresses:
    put:
      tags:
      - business
      summary: Ganti seluruh daftar alamat (urutan = urutan tampil; AC-BIZ-003).
      operationId: put_addresses
      parameters:
      - name: tenant_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/AddressDto'
        required: true
      responses:
        '200':
          description: Tersimpan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_BusinessView'
        '405':
          description: Method tidak diizinkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '408':
          description: Request melebihi `server.request_timeout_secs`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Body melebihi `server.body_limit_bytes`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Kesalahan internal (tanpa detail internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - sessionCookie: []
  /api/v1/tenants/{tenant_id}/business/hour-exceptions:
    put:
      tags:
      - business
      summary: Ganti daftar hari libur / jam khusus (AC-BIZ-005). Maks 100 tanggal.
      operationId: put_exceptions
      parameters:
      - name: tenant_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ExceptionDto'
        required: true
      responses:
        '200':
          description: Tersimpan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_BusinessView'
        '405':
          description: Method tidak diizinkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '408':
          description: Request melebihi `server.request_timeout_secs`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Body melebihi `server.body_limit_bytes`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Kesalahan internal (tanpa detail internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - sessionCookie: []
  /api/v1/tenants/{tenant_id}/business/hours:
    put:
      tags:
      - business
      summary: Ganti jam operasional mingguan (AC-BIZ-004).
      operationId: put_hours
      parameters:
      - name: tenant_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/HoursDto'
        required: true
      responses:
        '200':
