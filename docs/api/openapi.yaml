        '503':
          description: Rate limiter/DB tidak tersedia (fail-closed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security: []
  /api/v1/invitations/accept:
    post:
      tags:
      - team
      summary: |-
        Terima undangan (AUTH-010, sekali pakai). Login → email akun harus sama dengan undangan.
        Tanpa sesi → akun baru dibuat dengan password (token membuktikan kepemilikan inbox).
      operationId: accept
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInput'
        required: true
      responses:
        '200':
          description: Bergabung
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_AcceptResult'
        '404':
          description: Token tidak valid/kedaluwarsa/sudah dipakai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '405':
          description: Method tidak diizinkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '408':
          description: Request melebihi `server.request_timeout_secs`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Body melebihi `server.body_limit_bytes`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Kesalahan internal (tanpa detail internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - sessionCookie: []
  /api/v1/permissions:
    get:
      tags:
      - team
      summary: Katalog permission yang dikenal (untuk editor role kustom).
      operationId: permissions
      responses:
        '200':
          description: Permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_Vec_String'
        '405':
          description: Method tidak diizinkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '408':
          description: Request melebihi `server.request_timeout_secs`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Body melebihi `server.body_limit_bytes`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Kesalahan internal (tanpa detail internal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - sessionCookie: []
  /api/v1/plans:
    get:
      tags:
      - billing
      summary: Paket yang ditawarkan (publik, untuk halaman harga).
      operationId: list_plans
      responses:
        '200':
          description: Paket aktif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_Vec_PlanView'
        '405':
          description: Method tidak diizinkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '408':
          description: Request melebihi `server.request_timeout_secs`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Body melebihi `server.body_limit_bytes`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
