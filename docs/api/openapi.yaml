- name: auth
  description: Registrasi, login, sesi (cookie HttpOnly + CSRF, ADR-0015)
- name: tenants
  description: Tenant milik pemanggil; tenant_id di path diverifikasi terhadap membership
- name: website
  description: Template, draft, publish, rollback (ADR-0007, ADR-0014)
- name: public
  description: Situs publik tenant; tenant dari Host, tanpa sesi (ADR-0014)
- name: business
  description: Profil, alamat, jam operasional tenant (PRD.md §4.4)
- name: catalog
  description: Produk, varian, kategori (PRD.md §4.5)
- name: commerce
  description: Pengaturan checkout, order, pembayaran QRIS statis (PRD.md §4.7, ADR-0004)
- name: approvals
  description: Approval engine multi-step (PRD.md §4.9, P4-2)
- name: audit
  description: Audit log append-only (PRD.md §6.9, P4-5)
- name: ai
  description: 'Pengaturan AI: provider platform/BYOK, kunci masked, konfigurasi chatbot (PRD.md §4.10, ADR-0011)'
- name: notifications
  description: Notifikasi in-app (PRD.md §4.13, P4-4)
- name: tickets
  description: 'Ticket support: lifecycle, assign, balasan, SLA (PRD.md §4.8, P4-3)'
- name: team
  description: Anggota, role kustom, undangan (PRD.md §3, P4-1)
- name: crm
  description: Customer, tag, catatan internal, hapus/export (PRD.md §4.6, ADR-0005)
- name: inventory
  description: Stok, movement ledger, ambang low-stock (PRD.md §4.5)
- name: files
  description: Upload gambar tenant + signed URL ber-expiry (ADR-0009)
- name: conversations
  description: Conversation viewer staf; data sensitif dimasking sesuai permission (PRD.md §4.12, P6-3)
- name: analytics
  description: Analitik percakapan dari agregat harian yang bertahan setelah purge (PRD.md §4.12, P6-6)
- name: billing
  description: Paket Starter/Pro & langganan toko; batas paket = data (PRD.md §4.15, ADR-0016)
- name: platform
  description: 'Admin platform (super_admin + sesi MFA): verifikasi pembayaran langganan lintas toko, diaudit (ADR-0016)'
- name: chat
  description: 'Web chat publik toko: tenant dari Host, cookie sesi chat host-only (ADR-0006, P6-2)'
