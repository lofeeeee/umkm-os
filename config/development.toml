# Konfigurasi non-rahasia — development. Secret TIDAK boleh di sini (PRD.md §6.7);
# di-inject via env: UMKM_DATABASE_URL, UMKM_REDIS_URL.
environment = "development"

[server]
host = "127.0.0.1"
port = 8080
# Batas request (PRD.md §6.4)
request_timeout_secs = 30
body_limit_bytes = 1048576

[http]
# CORS allowlist dashboard (ADR-0015). Tanpa wildcard; production wajib https.
cors_allowed_origins = ["http://localhost:3000"]
# true hanya bila API berada di belakang Caddy (Caddy membuang XFF dari klien).
trust_forwarded_for = false

[legal]
# D-12: placeholder sampai teks final di-review legal (wajib sebelum go-live).
privacy_policy_version = "placeholder-v0"
terms_of_service_version = "placeholder-v0"

[metrics]
# Port internal; TIDAK diproxy Caddy dan tidak dipublish (PRD.md §9.8)
host = "127.0.0.1"
port = 9090

[database]
max_connections = 5
acquire_timeout_secs = 5

[redis]
# Namespace key Redis per environment (PRD.md §9.5)
key_prefix = "umkm:development"

[tenancy]
# Development memakai localhost; staging/production menunggu D-01.
root_domain = "localhost"

[observability]
log_format = "pretty"
