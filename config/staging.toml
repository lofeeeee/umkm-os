# Konfigurasi non-rahasia — staging. Secret TIDAK boleh di sini (PRD.md §6.7);
# di-inject via env: UMKM_DATABASE_URL, UMKM_REDIS_URL, UMKM_FILE_SIGNING_KEY.
environment = "staging"

[server]
host = "0.0.0.0"
port = 8080
# Batas request (PRD.md §6.4)
request_timeout_secs = 30
# 2 MiB upload gambar (ADR-0009) + 64 KiB overhead; body JSON dibatasi lagi oleh validator.
body_limit_bytes = 2162688

[http]
# CORS allowlist dashboard (ADR-0015). Tanpa wildcard; production wajib https.
cors_allowed_origins = []
# true hanya bila API berada di belakang Caddy (Caddy membuang XFF dari klien).
trust_forwarded_for = true

[legal]
# D-12: placeholder sampai teks final di-review legal (wajib sebelum go-live).
privacy_policy_version = "placeholder-v0"
terms_of_service_version = "placeholder-v0"

[worker]
poll_interval_ms = 1000
batch_size = 20
lease_secs = 60
max_attempts = 8
base_backoff_secs = 30
# <ROOT_DOMAIN> diganti tenancy.root_domain saat load (ADR-0001). Token di fragment (#token=).
verify_url_base = "https://app.<ROOT_DOMAIN>/verify-email"

[retention]
# ADR-0012. Angka di sini, bukan di kode. Batas bawah keamanan juga dipaksa di fungsi DB.
audit_days = 365
closed_tenant_grace_days = 30
# Percakapan: sejak pesan terakhir (app.purge_conversations, P6-1).
conversation_days = 30
# Belum dipakai: purge file/pelanggan saat ini mengikuti closed_tenant_grace_days.
file_grace_days = 30
customer_data_grace_days = 30
# Minimalisasi data (bukan ADR): sesi/token tidak berlaku & event outbox selesai.
auth_artifact_days = 30
outbox_days = 30
purge_interval_secs = 3600

[metrics]
# Port internal; TIDAK diproxy Caddy dan tidak dipublish (PRD.md §9.8)
host = "0.0.0.0"
port = 9090

[database]
max_connections = 10
acquire_timeout_secs = 5

[redis]
# Namespace key Redis per environment (PRD.md §9.5)
key_prefix = "umkm:staging"

[tenancy]
# Subdomain staging ditetapkan saat environment staging dibuat (ADR-0001).
root_domain = "<ROOT_DOMAIN>"

[storage]
# ADR-0009: lokal PostgreSQL. Kuota sementara sampai D-10 (plan limits).
max_object_bytes = 2097152
max_objects_per_tenant = 200
signed_url_ttl_secs = 3600

[observability]
log_format = "json"

[ai]
# Batas permintaan bersamaan ke provider AI per proses (SSRF guard, ADR-0011).
max_concurrency = 8

[ai.platform]
# Provider AI milik platform (ADR-0011). Aktifkan setelah base_url/model disepakati;
# kunci di secret UMKM_PLATFORM_AI_API_KEY, tidak pernah di file ini.
enabled = false
base_url = ""
models = []
embedding_model = ""
# Kuota bulanan per tenant dalam satuan token (prompt + completion); angka final mengikuti D-10.
monthly_quota = 200000
# AC-SUB-002: harga provider platform (Rp per 1 juta token) untuk estimasi biaya per panggilan AI.
# 0 = belum diketahui → estimasi disimpan NULL (bukan dianggap gratis). Isi sesuai tarif provider.
input_cost_per_million_idr = 0.0
output_cost_per_million_idr = 0.0

[billing]
# ADR-0016: pembayaran langganan manual. PLACEHOLDER — isi rekening/QRIS platform yang sah sebelum go-live.
payment_instructions = "Transfer ke rekening platform (placeholder; diganti sebelum go-live), lalu unggah bukti bayar."
