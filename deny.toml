# cargo deny check — advisories, lisensi, sumber (PRD.md §7.1, PRD.md §14.2)
[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib",
    # BSL-1.0 (Boost): permisif, OSI-approved; masuk via xxhash-rust <- redis (P0-6)
    "BSL-1.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

# CDLA-Permissive-2.0: lisensi DATA permisif untuk bundel sertifikat CA Mozilla; hanya untuk crate ini (P5-3).
[[licenses.exceptions]]
allow = ["CDLA-Permissive-2.0"]
crate = "webpki-root-certs"


[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
